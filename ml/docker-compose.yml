services:
  ml-server:
    build: .
    container_name: dota2bot-ml
    restart: unless-stopped
    ports:
      - "5544:5544"
    environment:
      # set in ml/.env (never commit it); players put the same value
      # in Customize.ML.Api_Key
      ML_API_KEY: "${ML_API_KEY:-}"
    volumes:
      - ./data:/data
